<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Babe's Passport</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1e8d4;--fg:#1b2a49;--gold:#1b2a49;--red:#b3122b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:repeating-linear-gradient(0deg,#0000 0 27px,#1b2a490d 27px 28px),var(--bg);color:var(--fg);font:400 18px/1.5 'Courier Prime','Courier New',monospace;overflow:hidden;touch-action:manipulation}
.st{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;padding:24px;text-align:center;overflow-y:auto}
.st.on{display:flex;animation:in .8s}
.st>*{flex-shrink:0}
.st{-webkit-overflow-scrolling:touch}
@keyframes in{from{opacity:0}to{opacity:1}}
h2{font-size:27px;margin:0;font-weight:700;letter-spacing:.04em}
p{margin:0;max-width:440px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--gold);border-radius:4px;padding:10px 22px;cursor:pointer;min-width:190px}
button:hover,button:focus-visible{background:var(--gold);color:var(--bg);outline:none}
button:disabled{opacity:.35;pointer-events:none}
#cov{width:min(78vw,300px);padding:40px 20px;border-radius:10px;background:#1b2a49;color:#e9c46a;border:2px solid #e9c46a;box-shadow:6px 8px 0 #1b2a4944;cursor:pointer;display:flex;flex-direction:column;gap:14px;align-items:center}
.pg{border:2px solid var(--fg);border-radius:6px;padding:22px 26px;background:#fffaf0;text-align:left;box-shadow:6px 8px 0 #1b2a4933}
.slot.ok{border-color:var(--red);color:var(--red);transform:rotate(-3deg)}
.stamp{border:4px double var(--red);color:var(--red);padding:12px 22px;font-size:28px;font-weight:700;letter-spacing:.06em;transform:rotate(-8deg);animation:pop .6s;mix-blend-mode:multiply}
@keyframes pop{from{transform:scale(2.2) rotate(-20deg);opacity:0}}
#g{display:grid;grid-template-columns:repeat(3,1fr);width:min(90vw,330px);aspect-ratio:4/3;gap:2px}
.t{background-size:300% 300%;background-image:var(--p);cursor:pointer;outline:2px solid transparent;outline-offset:-2px}
.t.s{outline-color:var(--gold)}
#b{width:min(75vw,280px);border-radius:8px;transition:filter 1.5s}
#sc{position:relative;width:min(90vw,330px);aspect-ratio:4/3}
#sc img,#sc canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:8px}
#cv{touch-action:none;transition:opacity 1.5s}
.pol{display:flex;gap:10px;justify-content:center}
figure{margin:0;background:#fffaf0;box-shadow:2px 3px 6px #0004;color:#222;padding:6px 6px 2px;transform:rotate(var(--r));width:min(28vw,120px);font-size:14px}
figure img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
#let{min-height:150px;font-size:22px;max-width:460px}
#fin{opacity:0;transition:opacity 2s;color:var(--gold);font-size:23px}
#fin b{display:block;margin-top:12px;color:var(--fg);font-size:26px;font-style:italic;font-weight:500}
#m{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 10px);min-width:0;padding:6px 12px;z-index:9}
.sh{animation:sh .4s}
.bd{background:#111c33;border-radius:6px;padding:14px;width:min(92vw,360px);display:flex;flex-direction:column;gap:8px;box-shadow:6px 8px 0 #1b2a4944}
.bd button{background:none;border:0;border-bottom:1px dashed #ffbf3c55;border-radius:0;color:#ffbf3c;text-align:left;font-weight:700;letter-spacing:.08em}
.bd button:hover{background:#ffbf3c;color:#111c33}
#fl{font-size:56px;animation:fly 1.6s ease-in-out forwards}
@keyframes fly{from{transform:translateX(-45vw) rotate(-8deg)}to{transform:translateX(45vw) rotate(-8deg)}}
.bp{width:min(92vw,360px);background:#fffaf0;border:2px solid var(--fg);border-radius:8px;text-align:left;box-shadow:6px 8px 0 #1b2a4933;overflow:hidden}
.bp div{padding:10px 16px;border-bottom:2px dashed var(--fg);font-size:16px}
.bp b{display:block;font-size:12px;opacity:.6;font-weight:400}
#stub{border-bottom:0;cursor:pointer;background:var(--red);color:#fffaf0;font-weight:700;text-align:center}
#stub b{display:block;margin-top:8px;font-size:19px;opacity:1;font-weight:700}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>
